<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كوتي كوتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rose-50: #fff7f9;
    --rose-100: #fde8ee;
    --rose-200: #f8c8d6;
    --rose-300: #f0a3bb;
    --rose-400: #e77b9b;
    --rose-500: #d65a84;
    --rose-600: #c4456f;
    --rose-800: #7d2446;
    --shadow-sm: 0 2px 8px rgba(125, 36, 70, .07);
    --shadow-md: 0 8px 22px rgba(125, 36, 70, .13);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: var(--rose-50);
    color: var(--rose-800);
    min-height: 100vh;
  }

  header {
    padding: 40px 16px 30px;
    text-align: center;
    background: linear-gradient(160deg, var(--rose-200) 0%, var(--rose-100) 45%, var(--rose-50) 100%);
    border-bottom: 1px solid var(--rose-200);
  }
  .brand {
    font-size: 42px;
    font-weight: 800;
    margin: 0;
    letter-spacing: .5px;
    color: var(--rose-600);
    text-shadow: 0 2px 0 rgba(255,255,255,.6);
  }
  .brand .heart { color: var(--rose-500); font-size: 26px; vertical-align: middle; margin: 0 10px; }
  .tagline { margin: 8px 0 14px; color: var(--rose-500); font-size: 15px; }
  .follow {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 999px;
    background: #fff;
    color: var(--rose-600);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    border: 1.5px solid var(--rose-300);
    box-shadow: var(--shadow-sm);
  }

  .toolbar {
    max-width: 1000px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .search-box { position: relative; }
  .search-box input {
    width: 100%;
    padding: 14px 44px 14px 16px;
    border: 1.5px solid var(--rose-200);
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    background: #fff;
    color: var(--rose-800);
    outline: none;
    box-shadow: var(--shadow-sm);
  }
  .search-box input:focus { border-color: var(--rose-400); box-shadow: 0 0 0 4px rgba(231,123,155,.18); }
  .search-box input::placeholder { color: var(--rose-300); }
  .search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--rose-400);
    font-size: 18px;
    pointer-events: none;
  }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: 1; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--rose-200);
    background: #fff;
    color: var(--rose-600);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active {
    background: var(--rose-500);
    border-color: var(--rose-500);
    color: #fff;
    box-shadow: 0 4px 12px rgba(214,90,132,.3);
  }
  .sort {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--rose-200);
    background: #fff;
    color: var(--rose-600);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }

  .count { max-width: 1000px; margin: 16px auto 0; padding: 0 16px; font-size: 13px; color: var(--rose-400); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    padding: 14px 16px 40px;
    max-width: 1000px;
    margin: auto;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--rose-100);
    transition: transform .25s ease, box-shadow .25s ease;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .card-img { position: relative; aspect-ratio: 1; background: var(--rose-100); overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .card:hover img { transform: scale(1.05); }
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,.92);
    color: var(--rose-600);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }
  .badge.off { color: #b3261e; }
  .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-weight: 700; font-size: 15px; line-height: 1.4; }
  .cat { font-size: 12px; color: var(--rose-300); }
  .price { margin-top: auto; color: var(--rose-600); font-weight: 800; font-size: 16px; }
  .empty { text-align: center; color: var(--rose-400); padding: 60px 16px; font-size: 16px; grid-column: 1 / -1; }

  /* النافذة */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(125, 36, 70, .45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 22px;
    max-width: 460px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(125, 36, 70, .3);
    position: relative;
  }
  .close {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.95);
    color: var(--rose-600);
    font-size: 20px;
    cursor: pointer;
    z-index: 2;
    box-shadow: var(--shadow-sm);
  }
  .gallery { position: relative; background: var(--rose-100); }
  .gallery .main { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: var(--rose-100); }
  .gallery .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.9);
    color: var(--rose-600);
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .gallery .nav.prev { right: 10px; }
  .gallery .nav.next { left: 10px; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose-200); border: none; padding: 0; cursor: pointer; }
  .dot.active { background: var(--rose-500); }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 0; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs img {
    width: 56px; height: 56px; object-fit: cover; border-radius: 10px;
    flex-shrink: 0; cursor: pointer; border: 2px solid transparent; opacity: .7;
  }
  .thumbs img.active { border-color: var(--rose-500); opacity: 1; }

  .m-body { padding: 16px 20px 22px; }
  .m-name { margin: 0 0 6px; font-size: 20px; font-weight: 800; color: var(--rose-800); }
  .m-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .m-price { color: var(--rose-600); font-weight: 800; font-size: 18px; }
  .m-cat { font-size: 12px; background: var(--rose-100); color: var(--rose-600); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  .m-desc { font-size: 14px; line-height: 1.8; color: var(--rose-800); white-space: pre-wrap; margin: 0 0 16px; }
  .order-btn {
    display: block;
    text-align: center;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 6px 16px rgba(196,69,111,.3);
  }
  .order-btn.disabled { background: #ccc; box-shadow: none; pointer-events: none; }

  footer {
    text-align: center;
    padding: 22px;
    color: var(--rose-400);
    font-size: 13px;
    border-top: 1px solid var(--rose-200);
    background: #fff;
  }
</style>
</head>
<body>

<header>
  <h1 class="brand"><span class="heart">♥</span>كوتي كوتي<span class="heart">♥</span></h1>
  <p class="tagline">أدوات مدرسية وأقلام وإكسسوارات · توصيل لكل محافظات مصر</p>
  <a class="follow" href="https://www.tiktok.com/@user874059774" target="_blank">تابعينا على تيك توك</a>
</header>

<div class="toolbar">
  <div class="search-box">
    <input type="text" id="search" placeholder="ابحثي عن منتج...">
    <span class="search-icon">⌕</span>
  </div>
  <div class="filters">
    <div class="chips" id="chips"></div>
    <select class="sort" id="sort">
      <option value="new">الأحدث</option>
      <option value="high">الأعلى سعراً</option>
      <option value="low">الأقل سعراً</option>
    </select>
  </div>
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<!-- نافذة تفاصيل المنتج -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close" id="closeBtn">×</button>
    <div class="gallery">
      <img class="main" id="mainImg" alt="">
      <button class="nav prev" id="prevBtn">›</button>
      <button class="nav next" id="nextBtn">‹</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="m-body">
      <h2 class="m-name" id="mName"></h2>
      <div class="m-meta">
        <span class="m-price" id="mPrice"></span>
        <span class="m-cat" id="mCat"></span>
      </div>
      <p class="m-desc" id="mDesc"></p>
      <a class="order-btn" id="orderBtn" target="_blank">اضغطي للطلب من خلال رسائل صفحة التيك توك</a>
    </div>
  </div>
</div>

<footer>كوتي كوتي ♥</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDefKc0xN_x5YA9EuCRCr9KHmcXJcCcp-E",
    authDomain: "pro-1-7e986.firebaseapp.com",
    projectId: "pro-1-7e986",
    storageBucket: "pro-1-7e986.firebasestorage.app",
    messagingSenderId: "173922549296",
    appId: "1:173922549296:web:a3f5b4ee20769329aef7f5",
    measurementId: "G-RDPP4N5HFD"
  };

  const user874059774 = "user874059774";

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const $ = id => document.getElementById(id);
  let allProducts = [];
  let activeCategory = "all";
  let currentImages = [];
  let currentIndex = 0;

  db.collection("products").orderBy("createdAt", "desc").onSnapshot(snap => {
    allProducts = [];
    snap.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
    buildChips();
    render();
  }, err => {
    $("grid").innerHTML = '<div class="empty">حصلت مشكلة في تحميل المنتجات</div>';
    console.error(err);
  });

  function imagesOf(p) {
    if (Array.isArray(p.imageUrls) && p.imageUrls.length) return p.imageUrls;
    return p.imageUrl ? [p.imageUrl] : [];
  }

  let storedCategories = [];
  db.collection("categories").onSnapshot(snap => {
    storedCategories = [];
    snap.forEach(doc => storedCategories.push(doc.data().name));
    buildChips();
    render();
  });

  function buildChips() {
    const box = $("chips");
    const cats = [...new Set([...storedCategories, ...allProducts.map(p => p.category || "أخرى")])];
    const all = ["all", ...cats];
    box.innerHTML = "";
    all.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "chip" + (activeCategory === c ? " active" : "");
      btn.textContent = c === "all" ? "الكل" : c;
      btn.onclick = () => { activeCategory = c; buildChips(); render(); };
      box.append(btn);
    });
  }

  function render() {
    const grid = $("grid");
    const q = $("search").value.trim().toLowerCase();
    let list = allProducts.filter(p => {
      const cat = p.category || "أخرى";
      const matchCat = activeCategory === "all" || cat === activeCategory;
      const matchQ = !q || (p.name || "").toLowerCase().includes(q);
      return matchCat && matchQ;
    });
    if ($("sort").value === "high") list.sort((a, b) => b.price - a.price);
    if ($("sort").value === "low") list.sort((a, b) => a.price - b.price);

    grid.innerHTML = "";
    $("count").textContent = list.length ? `${list.length} منتج` : "";

    if (!list.length) {
      grid.innerHTML = '<div class="empty">مفيش منتجات تطابق بحثك</div>';
      return;
    }

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openModal(p);

      const imgWrap = document.createElement("div");
      imgWrap.className = "card-img";
      const img = document.createElement("img");
      img.src = imagesOf(p)[0] || "";
      img.alt = p.name;
      imgWrap.append(img);

      if (p.available === false) {
        const b = document.createElement("span");
        b.className = "badge off";
        b.textContent = "غير متاح";
        imgWrap.append(b);
      } else if (p.category) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = p.category;
        imgWrap.append(b);
      }

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.name;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = p.price + " جنيه";
      info.append(name, price);

      card.append(imgWrap, info);
      grid.append(card);
    });
  }

  // ---------- النافذة ----------
  function openModal(p) {
    currentImages = imagesOf(p);
    currentIndex = 0;
    $("mName").textContent = p.name;
    $("mPrice").textContent = p.price + " جنيه";
    $("mCat").textContent = p.category || "أخرى";
    $("mDesc").textContent = p.description || "";

    const order = $("orderBtn");
    order.href = `https://www.tiktok.com/@${user874059774}`;
    order.classList.toggle("disabled", p.available === false);
    order.textContent = p.available === false
      ? "المنتج غير متاح حالياً"
      : "اضغطي للطلب من خلال رسائل صفحة التيك توك";

    renderGallery();
    $("overlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function renderGallery() {
    const hasMany = currentImages.length > 1;
    $("mainImg").src = currentImages[currentIndex] || "";
    $("prevBtn").style.display = hasMany ? "block" : "none";
    $("nextBtn").style.display = hasMany ? "block" : "none";

    const dots = $("dots");
    dots.innerHTML = "";
    if (hasMany) {
      currentImages.forEach((_, i) => {
        const d = document.createElement("button");
        d.className = "dot" + (i === currentIndex ? " active" : "");
        d.onclick = () => { currentIndex = i; renderGallery(); };
        dots.append(d);
      });
    }

    const thumbs = $("thumbs");
    thumbs.innerHTML = "";
    if (hasMany) {
      currentImages.forEach((src, i) => {
        const t = document.createElement("img");
        t.src = src;
        t.className = i === currentIndex ? "active" : "";
        t.onclick = () => { currentIndex = i; renderGallery(); };
        thumbs.append(t);
      });
    }
  }

  $("prevBtn").onclick = () => {
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    renderGallery();
  };
  $("nextBtn").onclick = () => {
    currentIndex = (currentIndex + 1) % currentImages.length;
    renderGallery();
  };

  function closeModal() {
    $("overlay").classList.remove("show");
    document.body.style.overflow = "";
  }
  $("closeBtn").onclick = closeModal;
  $("overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };

  $("search").addEventListener("input", render);
  $("sort").addEventListener("change", render);
</script>
</body>
</html>
